<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteúdo Aula 16 - HTML</title>
</head>
<body>
   
        <h1>Introdução a formulário no HTML</h1>

        <form>
            <label for="p-nome">Primeiro Nome</label><br>
            <input type="text" name="p-nome" id="p-nome"><br>
            <label for="s-nome">Sobrenome:</label><br>
            <input type="text" name="s-nome" id="s-nome"><br><br>
            <input type="button" value="Enviar">

        </form>

        <hr>

        <h3>Input tipo Radio</h3>

        <form>
            <input type="radio"
            name="tec-opcoes" id="html"
            value="HTML"><label for="html">HTML</label>
            <br>
            <input type="radio"
            name="tec-opcoes" id="css"
            value="CSS"><label for="css">CSS</label>
            <br>
            <input type="radio"
            name="tec-opcoes" id="js"
            value="JavaScript"><label for="js">JavaScript</label>
            <br>
        
        </form>

</body>
</html>
