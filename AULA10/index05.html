<!DOCTYPE html>
<html lange="pt-br">
    <head>
        <title>Conteúdo Aula10 - HTML</title>

    </head>
    <body>

        <h1>Definindo Listas no HTML</h1>

        <h3>Exemplo de lista não ordenada</h3>

        <ul>
           <li>Item</li>
           <li>Item</li>
           <li>Item</li>
           <li>Item</li>
           <li>Item</li>
        </ul>

        <hr>

        <h3>Exemplo de lista ordenada</h3>

        <ol>
            <li>Item</li>
            <li>Item</li>
            <li>Item</li>
            <li>Item</li>
            <li>Item</li>
        </ol>

    </body>
</html>
