<!DOCTYPE html>
<html lange="pt-br">
    <head>
        <title>Conteúdo Aula13 - HTML</title>

        <style>
            .importante {
                color: darkred;
                font-weight: bold;
                font-size: 150%;
            }

            .cidades {
                background-color: darkviolet;
                border: 6px solid purple;
                color: ghostwhite;
                padding: 10px;
                }

                .centralizado {
                    text-align: center;
                }

                .estilo {
                    background-color: navy;
                    color: aliceblue;
                    padding: 10px;
                    border: 4px solid goldenrod;
                }
            
        </style>

    </head>
    <body>

        <h1>Class em HTML</h1>

        <h2>Título <span class="importante">importante</span> em HTML</h2>

        <p>Exemplo de conteúdo <span class="importante">importante</span> no HTML</p>

        <hr>

        <h3>Definindo mais de uma classe para elementos</h3>

        <h2 class="cidades centralizado">Manaus</h2>
        <h2 class="cidades">Maceió</h2>
        <h2 class="cidades">Curitiba</h2>

        <hr>

        <h3>Mesmas classes em elementos diferentes</h3>

        <h2 class="estilo">Eu sou um h2</h2>
        <p class="estilo">E eu sou um parágrafo</p>

        <hr>

    </body>
</html>
