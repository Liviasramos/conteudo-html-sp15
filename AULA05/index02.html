<!DOCTYPE html>
<html lange="pt-br">
    <head>
        <title>Conteúdo Aula05 - HTML</title>
    </head>
    <body>
       <h1>Definindo estilos no HTML</h1>

       <p style="color: orange;">Eu sou laranja</p>
       <p style="color: purple;">Eu sou roxo</p>
       <p style="font-size: 30px; font-weight: bold;">Eu estou em destaque</p>

       <hr>

       <h3>Definindo cores de fundo a elementos no HTML:</h3>

       <p style="background-color: tomato;">Eu sou um parágrafo</p>
       <p style="background-color: crimson;">Eu sou outro parágrafo</p>

       <hr>

       <h3>Definindo novas fontes com o atributo style:</h3>

       <p style="font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;">Eu sou um parágrafo</p>

       <p style="font-family: monospace;">Eu sou outro parágrafo</p>

    </body>
</html>
