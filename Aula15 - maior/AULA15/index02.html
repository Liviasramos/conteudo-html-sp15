<DOCTYPE html>
    <html lange="pt-br">
        <head>
            <title>Conteúdo Aula15 - HTML</title>
        </head>
        <body>
            <h1>Caminhos de arquivos no HTML</h1>

            <h3>Arquivo no mesmo nível do HTML</h3>

            <img src="angelushtml.jpg" width="250" height="170">

            <hr>

            <h3>Arquivo em uma pasta de mesmo nível que o HTML</h3>

            <img src="img/angelushtml.jpg" width="250" height="170">

            <hr>

            <h3>Arquivo em uma pasta na raiz da estrutura</h3>

            <img src="/Aula15-img/angelushtml.jpg" width="250" height="170">

            <hr>

            <h3>Arquivo em nível maior que o HTML</h3>

            <img src="../angelushtml.jpg" width="250" height="170">

        </body>
    </html>
