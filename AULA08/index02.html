            /* Transformando link em botã com estilos */

             a:link, a:visited {
               background-color: brown;
               color: bisque;
               text-decoration: none;
               padding: 15px 25px;
               display: inline-block;
               border: 4px solid #000;
               font-family: 'Times New Roman', Times, serif;
               font-size: 16px;
               font-weight: bold;
             }

             a:hover, a:active{
                background-color: bisque;
                color: #000;
                border: 4px solid crimson;
                transition: .3s;
             }

             a:active {
                box-shadow: inset 0 0 2px 0 #000
             }

        </style>
        
    </head>
    <body>
        <h1>Mudando estilos do link</h1>

        <a href="###">Isso é um link</a>

        <hr>

        <h3>Definido estilo de botão em um link</h3>

        <a href="###">Link</a>

    </body>
